{% extends "base.html" %}

{% block title %}Log in — Aftertaste{% endblock %}

{% block content %}
<section class="auth-panel">
  <h1>Log in</h1>
  <p class="panel-lede">Pick up where you left your glass.</p>

  <form method="post" class="stack-form">
    <label>
      Username
      <input type="text" name="username" required autocomplete="username">
    </label>
    <label>
      Password
      <input type="password" name="password" required autocomplete="current-password">
    </label>
    <button type="submit" class="btn">Log in</button>
  </form>

  <p class="panel-foot">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
</section>
{% endblock %}
