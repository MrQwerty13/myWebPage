{% extends "base.html" %}

{% block title %}{{ _('login.title') }}{% endblock %}

{% block content %}
<section class="sheet">
  <p class="sheet-kicker">Aftertaste</p>
  <h1>{{ _('login.heading') }}</h1>
  <p class="sheet-lede">{{ _('login.lede') }}</p>

  <form method="post" class="stack-form">
    <label>
      {{ _('field.email') }}
      <input type="email" name="email" required autocomplete="email">
    </label>
    <label>
      {{ _('field.password') }}
      <input type="password" name="password" required autocomplete="current-password">
    </label>
    <button type="submit" class="btn">{{ _('login.submit') }}</button>
  </form>

  <p class="sheet-foot">{{ _('login.foot') }} <a href="{{ url_for('auth.register') }}">{{ _('feed.create_account') }}</a></p>
</section>
{% endblock %}
