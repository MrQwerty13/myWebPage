{% extends "base.html" %}

{% block title %}{{ post.drink_name }} — Aftertaste{% endblock %}

{% block content %}
<article class="detail">
  <p class="detail-kicker">One take</p>
  <h1>{{ post.drink_name }}</h1>
  <p class="detail-body">{{ post.content }}</p>
  <div class="take-meta">
    <span>by {{ post.author_name }}</span>
    <span>{{ post.created_label }}</span>
  </div>
  <div class="take-actions">
    <button
      type="button"
      class="like-btn{% if post.liked %} is-liked{% endif %}"
      data-post-id="{{ post.id }}"
      data-liked="{{ 'true' if post.liked else 'false' }}"
      {% if not g.user %}disabled title="Log in to like"{% endif %}
    >
      <span class="like-label">{% if post.liked %}Liked{% else %}Like{% endif %}</span>
      <span class="like-count" data-count>{{ post.like_count }}</span>
    </button>
    <a class="text-link" href="{{ url_for('posts.feed') }}">Back to feed</a>
  </div>
</article>
{% endblock %}
