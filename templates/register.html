{% extends "base.html" %}

{% block title %}{{ _('register.title') }}{% endblock %}

{% block content %}
<section class="auth-panel">
  <h1>{{ _('register.heading') }}</h1>
  <p class="panel-lede">{{ _('register.lede') }}</p>

  <form method="post" class="stack-form">
    <label>
      {{ _('field.username') }}
      <input type="text" name="username" required minlength="3" autocomplete="username">
    </label>
    <label>
      {{ _('field.email') }}
      <input type="email" name="email" required autocomplete="email">
    </label>
    <label>
      {{ _('field.password') }}
      <input type="password" name="password" required minlength="6" autocomplete="new-password">
    </label>
    <button type="submit" class="btn">{{ _('register.submit') }}</button>
  </form>

  <p class="panel-foot">{{ _('register.foot') }} <a href="{{ url_for('auth.login') }}">{{ _('nav.log_in') }}</a></p>
</section>
{% endblock %}
